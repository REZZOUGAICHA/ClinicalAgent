[project]
name = "clinical-agent"
version = "0.1.0"
description = "Agentic multi-hop retrieval over clinical documents, with cited answers and an evaluation against a fixed single-pass RAG pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
